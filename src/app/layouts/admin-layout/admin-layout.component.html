<!-- Admin Layout Wrapper -->
<div class="admin-layout-container">
  <!-- Sidebar -->
  <aside class="admin-sidebar bg-dark text-white p-3">
    <div class="sidebar-brand mb-4 pb-2 border-bottom">
      <a routerLink="/" class="text-white text-decoration-none d-flex align-items-center gap-2">
        <i class="bi bi-buildings-fill text-primary fs-4"></i>
        <span class="fw-bold tracking-tight">UR Portal</span>
      </a>
    </div>

    <ul class="nav nav-pills flex-column mb-auto gap-1">
      <li class="nav-item">
        <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/admin/projects" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="bi bi-building-gear"></i> Manage Projects
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/admin/services" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="bi bi-tools"></i> Manage Services
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/admin/news" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="bi bi-newspaper"></i> Manage News
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/admin/gallery" routerLinkActive="active" class="nav-link text-white d-flex align-items-center gap-2">
          <i class="bi bi-images"></i> Manage Gallery
        </a>
      </li>
    </ul>

    <hr class="bg-secondary">

    <!-- User Info & Logout -->
    <div class="sidebar-footer d-flex justify-content-between align-items-center">
      <div class="user-info">
        <div class="small fw-semibold">{{ adminName }}</div>
        <span class="text-muted small" style="font-size:10px">CMS Administrator</span>
      </div>
      <button class="btn btn-sm btn-outline-danger" (click)="logout()" title="Logout">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </aside>

  <!-- Main Area -->
  <div class="admin-main flex-grow-1 d-flex flex-column bg-light">
    <!-- Navbar Header -->
    <header class="admin-header navbar navbar-expand bg-white border-bottom px-4 py-2 d-flex justify-content-between align-items-center">
      <span class="fw-semibold text-secondary">
        <i class="bi bi-calendar3 me-2"></i>Content Management System
      </span>
      <a routerLink="/" class="btn btn-xs btn-outline-primary rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i>View Website
      </a>
    </header>

    <!-- Content Router -->
    <main class="admin-content p-4 flex-grow-1">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
