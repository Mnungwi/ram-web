<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>United Ram Construction Company Ltd</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
  <!-- Preloader matching RAM theme style -->
  <div class="loader-outer" id="preloader">
    <div class="loader-container">
        <div class="loader-inner">
            <div class="loader">
              <div id="top" class="mask">
                <div class="plane"></div>
              </div>
              <div id="middle" class="mask">
                <div class="plane"></div>
              </div>
              <div id="bottom" class="mask">
                <div class="plane"></div>
              </div>
              <p class="loader-text" id="preloader-text">UNITED<span>RAM</span><br><small>CONSTRUCTION</small></p>
            </div>
        </div>
    </div>
  </div>
  <script type="text/javascript">
    // White-label splash screen — same DB-driven branding as the admin panel.
    // Guesses the API origin as api.<this domain>; edit API_ORIGIN_OVERRIDE
    // per client if a deployment doesn't follow that convention.
    (function () {
      var API_ORIGIN_OVERRIDE = null; // e.g. 'https://api.example.com'
      var host = window.location.hostname.replace(/^www\./, '');
      var apiOrigin = API_ORIGIN_OVERRIDE || (window.location.protocol + '//api.' + host);
      fetch(apiOrigin + '/api/theme')
        .then(function (r) { return r.json(); })
        .then(function (res) {
          var data = (res && res.data) || {};
          var textEl = document.getElementById('preloader-text');
          var outerEl = document.getElementById('preloader');
          if (data.theme_splash_title && textEl) {
            var parts = data.theme_splash_title.split(' ');
            var first = parts.shift() || '';
            var rest = parts.join(' ');
            textEl.innerHTML = first + '<span>' + rest + '</span>';
          }
          if (data.theme_splash_bg && outerEl) {
            outerEl.style.background = data.theme_splash_bg;
          }
        })
        .catch(function () { /* keep the default splash */ });
    })();
  </script>
</body>
</html>
